# Render blueprint: one web service + a free Postgres instance.
# New → Blueprint → point at this repo.
services:
  - type: web
    name: lastmile-delivery-tracker
    runtime: python
    plan: free
    region: singapore
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: DATABASE_URL
        fromDatabase:
          name: lastmile-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: ADMIN_EMAIL
        value: admin@lastmile.dev
      - key: ADMIN_PASSWORD
        sync: false          # set this in the dashboard, never in git
      - key: ENV
        value: production
      - key: AUTO_SEED_ON_BOOT
        value: "true"
      - key: PUBLIC_BASE_URL
        sync: false          # set to your Render URL once assigned
      # Notifications stay simulated until these are filled in.
      - key: SMTP_HOST
        sync: false
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: MAIL_FROM
        sync: false

databases:
  - name: lastmile-db
    plan: free
    region: singapore
